# ---------------------------------------------------------------
# Default configuration. Every key can be overridden by:
#   1. a JVM system property   ->  mvn test -Dbrowser=firefox
#   2. an environment variable ->  BROWSER=firefox (dots become _ and UPPERCASE)
# ---------------------------------------------------------------
